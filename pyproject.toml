[project]
name = "owl-plate-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "sqlmodel>=0.0.22,<1", "python-multipart>=0.0.18", "h3>=4.1,<5", "httpx>=0.28,<1", "pillow>=11,<13", "python-dotenv>=1,<2", "cryptography>=44,<47", "google-auth[requests]>=2.37,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
submission = ["python-pptx>=1,<2", "qrcode>=8,<9"]
deployment = ["psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services/api/tests"]
