<!doctype html>
<!-- Owl Plate pickup display for It. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f8f8fa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1013"
      media="(prefers-color-scheme: dark)"
    />
    <title>Owl Plate – What's left?</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f8fa;
        --surface: #ffffff;
        --surface-subtle: #f1f2f6;
        --border: #e4e5ec;
        --ink: #121214;
        --ink-muted: #525560;
        --gold: #fdbb30;
        --gold-hover: #e5a41b;
        --gold-ink: #121214;
        --gold-text: #8a5e00;
        --gold-tint: #fef6e1;
        --success: #15803d;
        --success-tint: #dcfce7;
        --warning: #92400e;
        --warning-tint: #fef3c7;

        /* Chart series: one fixed colour per count, checked for colour-blind separation. */
        --series-available: #15803d;
        --series-held: #e5a41b;
        --series-picked-up: #2e79f5;
        --series-pantry-held: #6928b0;
        --series-pantry-transferred: #e24ea0;

        --ambient: rgba(253, 187, 48, 0.13);
        --sheen: rgba(253, 187, 48, 0.1);
        --halo: rgba(253, 187, 48, 0.5);
        --plate: linear-gradient(160deg, #ffffff, #f4f5f9);
        --track: #e9ebf1;
        --hub: #ffffff;
        --shadow-card:
          0 1px 1px rgba(18, 18, 20, 0.03), 0 4px 10px rgba(18, 18, 20, 0.035),
          0 18px 36px -12px rgba(18, 18, 20, 0.09),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        --shadow-raised:
          0 1px 1px rgba(18, 18, 20, 0.04), 0 8px 16px rgba(18, 18, 20, 0.06),
          0 26px 44px -14px rgba(18, 18, 20, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        --shadow-plate:
          0 1px 2px rgba(18, 18, 20, 0.05),
          0 12px 26px -8px rgba(18, 18, 20, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          inset 0 0 0 1px rgba(18, 18, 20, 0.04);
        --shadow-hub:
          0 1px 2px rgba(18, 18, 20, 0.08),
          0 8px 16px -4px rgba(18, 18, 20, 0.14), inset 0 1px 0 #ffffff;
        --shadow-button:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          0 1px 2px rgba(138, 94, 0, 0.28),
          0 10px 22px -8px rgba(229, 164, 27, 0.75);
        --shadow-button-pressed:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 1px 2px rgba(138, 94, 0, 0.3);

        --dur-fast: 150ms;
        --dur-normal: 220ms;
        --dur-slow: 350ms;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0f1013;
          --surface: #18191e;
          --surface-subtle: #22242b;
          --border: #353842;
          --ink: #f4f4f6;
          --ink-muted: #a1a5b2;
          --gold: #fdbb30;
          --gold-hover: #e5a41b;
          --gold-ink: #121214;
          --gold-text: #fdbb30;
          --gold-tint: #382e19;
          --success: #4ade80;
          --success-tint: #163424;
          --warning: #fbbf24;
          --warning-tint: #3d2f16;

          --series-available: #0a8558;
          --series-held: #c98500;
          --series-picked-up: #1899ec;
          --series-pantry-held: #8f54dc;
          --series-pantry-transferred: #e652a3;

          --ambient: rgba(253, 187, 48, 0.07);
          --sheen: rgba(253, 187, 48, 0.07);
          --halo: rgba(253, 187, 48, 0.4);
          --plate: linear-gradient(160deg, #1f2026, #15161a);
          --track: #0f1013;
          --hub: #1d1e24;
          --shadow-card:
            0 1px 1px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.26),
            0 24px 48px -14px rgba(0, 0, 0, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.05);
          --shadow-raised:
            0 1px 1px rgba(0, 0, 0, 0.35), 0 12px 24px rgba(0, 0, 0, 0.34),
            0 30px 56px -14px rgba(0, 0, 0, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.07);
          --shadow-plate:
            0 1px 2px rgba(0, 0, 0, 0.4), 0 14px 30px -8px rgba(0, 0, 0, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.06),
            inset 0 0 0 1px rgba(255, 255, 255, 0.03);
          --shadow-hub:
            0 1px 2px rgba(0, 0, 0, 0.5), 0 10px 18px -4px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.07);
          --shadow-button:
            inset 0 1px 0 rgba(255, 255, 255, 0.45),
            0 1px 2px rgba(0, 0, 0, 0.5),
            0 12px 26px -10px rgba(253, 187, 48, 0.5);
          --shadow-button-pressed:
            inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.5);
        }
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(90% 420px at 50% 0%, var(--ambient), transparent 72%)
            no-repeat,
          var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 3px solid var(--gold-text);
        outline-offset: 3px;
      }

      [data-series="available"] {
        --series: var(--series-available);
      }
      [data-series="held"] {
        --series: var(--series-held);
      }
      [data-series="picked_up"] {
        --series: var(--series-picked-up);
      }
      [data-series="pantry_held"] {
        --series: var(--series-pantry-held);
      }
      [data-series="pantry_transferred"] {
        --series: var(--series-pantry-transferred);
      }

      .shell {
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 16px 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 14px;
        background: var(--gold);
        color: var(--gold-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-button);
      }

      .brand-name {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .brand-sub {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 9999px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
      }

      .pill-demo {
        background: var(--gold-tint);
        color: var(--gold-text);
      }

      .status-badge {
        background: var(--surface-subtle);
        color: var(--ink-muted);
        transition:
          background-color var(--dur-slow) var(--ease),
          color var(--dur-slow) var(--ease);
      }

      .status-badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.55;
        transition: opacity var(--dur-slow) var(--ease);
      }

      .status-badge[data-tone="success"] {
        background: var(--success-tint);
        color: var(--success);
      }

      .status-badge[data-tone="success"]::before {
        opacity: 1;
        animation: breathe 2400ms ease-in-out infinite;
      }

      .status-badge[data-tone="gold"] {
        background: var(--gold-tint);
        color: var(--gold-text);
      }

      .status-badge[data-tone="gold"]::before {
        opacity: 1;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 4px 16px 0;
      }

      .info,
      .metrics {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }

      .metrics {
        perspective: 1100px;
      }

      .card {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 18px;
        box-shadow: var(--shadow-card);
        animation: rise var(--dur-slow) var(--ease) backwards;
        animation-delay: calc(var(--order, 0) * 45ms);
      }

      .listing-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .listing-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .food-name {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .location {
        margin: 0;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-muted);
      }

      .location svg {
        flex-shrink: 0;
        margin-top: 2px;
      }

      .answer {
        margin: 4px 0 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }

      .error-banner {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--warning-tint);
        color: var(--warning);
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        animation: rise var(--dur-normal) var(--ease) backwards;
      }

      .error-banner svg {
        flex-shrink: 0;
        margin-top: 2px;
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 22px 18px 16px;
        transform: rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
        transition:
          transform var(--dur-slow) var(--ease),
          box-shadow var(--dur-slow) var(--ease);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          260px circle at var(--sheen-x, 50%) var(--sheen-y, 0%),
          var(--sheen),
          transparent 70%
        );
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--dur-slow) var(--ease);
      }

      .ring-stage {
        position: relative;
        width: min(216px, 62vw);
        aspect-ratio: 1;
        margin: 0 auto;
        touch-action: manipulation;
      }

      .ring-stage::before,
      .ring-stage::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
      }

      .ring-stage::before {
        background: var(--plate);
        box-shadow: var(--shadow-plate);
      }

      .ring-stage.is-fresh::after {
        animation: halo 700ms var(--ease);
      }

      .ring {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        transition: opacity var(--dur-normal) var(--ease);
      }

      .hero[aria-busy="true"] .ring {
        opacity: 0.5;
      }

      .ring-track {
        fill: none;
        stroke: var(--track);
        stroke-width: 16;
      }

      .seg {
        fill: none;
        stroke: var(--series);
        stroke-width: 16;
        stroke-dasharray: 0 528;
        transition: opacity var(--dur-fast) var(--ease);
      }

      .seg.is-dim {
        opacity: 0.26;
      }

      .ring-hub {
        position: absolute;
        inset: 18%;
        border-radius: 50%;
        background: var(--hub);
        box-shadow: var(--shadow-hub);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      .hub-num {
        display: inline-block;
        font-size: 60px;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.035em;
        color: var(--ink);
      }

      .hub-num[data-len="3"] {
        font-size: 48px;
      }

      .hub-num[data-len="4"],
      .hub-num[data-len="5"] {
        font-size: 36px;
      }

      .hub-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-muted);
      }

      .swatch {
        width: 10px;
        height: 10px;
        flex-shrink: 0;
        border-radius: 3px;
        background: var(--series);
      }

      .tip {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 3;
        padding: 8px 12px;
        border-radius: 12px;
        background: var(--ink);
        color: var(--bg);
        font-size: 13px;
        line-height: 1.35;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -100%);
        transition: opacity var(--dur-fast) var(--ease);
        box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.45);
      }

      .tip[data-side="below"] {
        transform: translate(-50%, 0);
      }

      .tip[data-open="true"] {
        opacity: 1;
      }

      .tip-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tip-key {
        width: 12px;
        height: 3px;
        border-radius: 2px;
        background: var(--series);
      }

      .tip-value {
        font-weight: 800;
      }

      .tip-share {
        display: block;
        opacity: 0.72;
        font-size: 12px;
      }

      .hero-facts {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }

      .fact-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
      }

      .fact-value {
        display: inline-block;
        font-size: 26px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      .fact-end {
        text-align: right;
        font-size: 13px;
        color: var(--ink-muted);
      }

      .updated-text {
        margin: 0;
        font-weight: 500;
      }

      .live-status {
        display: block;
        min-height: 18px;
        font-weight: 700;
        color: var(--gold-text);
      }

      .tiles {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
      }

      .tile {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
        border-radius: 20px;
        padding: 14px;
        transition:
          transform var(--dur-normal) var(--ease),
          box-shadow var(--dur-normal) var(--ease);
      }

      .tile.is-lit {
        transform: translateY(-3px);
        box-shadow: var(--shadow-raised);
      }

      .tile-label {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        min-height: 2.6em;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--ink-muted);
      }

      .tile-label .swatch {
        margin-top: 3px;
      }

      .tile-value {
        margin: auto 0 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .num {
        display: inline-block;
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .dial {
        position: relative;
        width: 48px;
        height: 48px;
        flex-shrink: 0;
      }

      .dial svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .dial-track,
      .dial-arc {
        fill: none;
        stroke: var(--series);
        stroke-width: 5;
      }

      .dial-track {
        stroke-opacity: 0.2;
      }

      .dial-arc {
        stroke-dasharray: 0 114;
      }

      .dial-pct {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--ink-muted);
      }

      .is-popped {
        animation: pop var(--dur-slow) var(--ease);
      }

      .action {
        position: sticky;
        bottom: 0;
        z-index: 5;
        margin: 0 -16px;
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(to top, var(--bg) 74%, transparent);
      }

      .primary-btn {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 9999px;
        background: var(--gold);
        color: var(--gold-ink);
        font-family: inherit;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
        cursor: pointer;
        touch-action: manipulation;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 24px;
        box-shadow: var(--shadow-button);
        transition:
          background-color var(--dur-fast) var(--ease),
          opacity var(--dur-normal) var(--ease),
          box-shadow var(--dur-fast) var(--ease),
          transform var(--dur-fast) var(--ease);
      }

      .primary-btn:hover:not(:disabled) {
        background: var(--gold-hover);
      }

      .primary-btn:active:not(:disabled) {
        transform: scale(0.97);
        box-shadow: var(--shadow-button-pressed);
      }

      .primary-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: var(--shadow-button-pressed);
      }

      .spinner {
        display: none;
        width: 20px;
        height: 20px;
        animation: spin 800ms linear infinite;
      }

      .primary-btn[data-busy="true"] .spinner {
        display: block;
      }

      footer {
        padding: 0 16px 16px;
      }

      .disclosure {
        margin: 0;
        text-align: center;
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink-muted);
      }

      .disclosure a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 2px;
        color: var(--ink);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
        touch-action: manipulation;
        border-radius: 6px;
        transition: color var(--dur-fast) var(--ease);
      }

      .disclosure a:hover {
        color: var(--gold-text);
      }

      @media (hover: hover) and (pointer: fine) {
        .hero:hover {
          box-shadow: var(--shadow-raised);
        }

        .hero:hover::before {
          opacity: 1;
        }
      }

      @media (min-width: 900px) {
        .shell {
          max-width: 980px;
        }

        header {
          padding: 24px 24px 16px;
        }

        main {
          display: grid;
          grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
          grid-template-rows: auto 1fr;
          align-items: start;
          gap: 20px;
          padding: 4px 24px 8px;
        }

        .info {
          grid-column: 1;
          grid-row: 1;
        }

        .metrics {
          grid-column: 2;
          grid-row: 1 / span 2;
        }

        .action {
          grid-column: 1;
          grid-row: 2;
          position: static;
          margin: 0;
          padding: 0;
          background: none;
        }

        .food-name {
          font-size: 30px;
        }

        .ring-stage {
          width: 248px;
        }

        .hub-num {
          font-size: 68px;
        }

        .hub-num[data-len="3"] {
          font-size: 54px;
        }

        .hub-num[data-len="4"],
        .hub-num[data-len="5"] {
          font-size: 40px;
        }

        footer {
          padding: 8px 24px 20px;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }

      @keyframes pop {
        0% {
          transform: scale(0.92);
        }
        55% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes breathe {
        50% {
          opacity: 0.35;
        }
      }

      @keyframes halo {
        from {
          box-shadow: 0 0 0 0 var(--halo);
        }
        to {
          box-shadow: 0 0 0 18px transparent;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (forced-colors: active) {
        .ring,
        .dial,
        .swatch,
        .tip-key {
          forced-color-adjust: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        .hero {
          transform: none;
        }

        .tile.is-lit {
          transform: none;
        }
      }
    </style>
  </head>
  <body>

    <script>
      const ask = document.getElementById("ask");
      const askLabel = document.getElementById("ask-label");
      const status = document.getElementById("status");
      const statusBadge = document.getElementById("status-badge");
      const checkedTime = document.getElementById("checked-time");
      const errorBox = document.getElementById("error-box");
      const errorText = document.getElementById("error-text");
      const hero = document.getElementById("hero");
      const stage = document.getElementById("ring-stage");
      const ring = document.getElementById("ring");
      const tip = document.getElementById("tip");
      const tipValue = document.getElementById("tip-value");
      const tipName = document.getElementById("tip-name");
      const tipShare = document.getElementById("tip-share");
      const uuid =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      const UNLINKED_COPY = "This display isn't linked to a listing.";
      let binding = null;
      let waiting = false;
      let waitTimer = null;

      /* ---- Serving counts: numbers and share-of-total rings ---- */

      const COUNT_KEYS = [
        "total",
        "available",
        "held",
        "picked_up",
        "pantry_held",
        "pantry_transferred",
      ];
      const SERIES = COUNT_KEYS.slice(1);
      const COUNTER_MS = 600;
      const RING_LENGTH = 2 * Math.PI * 84;
      const DIAL_LENGTH = 2 * Math.PI * 18;
      const SEGMENT_GAP = 3;
      const NO_MATCH = { matches: false };
      const reduceMotion = window.matchMedia
        ? window.matchMedia("(prefers-reduced-motion: reduce)")
        : NO_MATCH;
      const finePointer = window.matchMedia
        ? window.matchMedia("(hover: hover) and (pointer: fine)")
        : NO_MATCH;

      const numberEls = {};
      COUNT_KEYS.forEach((key) => {
        numberEls[key] = document.querySelector(`[data-it-bind="${key}"]`);
      });
      const seriesParts = {};
      SERIES.forEach((key) => {
        const home = document.querySelector(`.series[data-series="${key}"]`);
        seriesParts[key] = {
          home,
          name: home.querySelector(".series-name").textContent.trim(),
          segment: ring.querySelector(`.seg[data-series="${key}"]`),
          dialArc: home.querySelector(".dial-arc"),
          dialPct: home.querySelector(".dial-pct"),
        };
      });

      /* Last real counts received, what is painted right now, and where it is heading. */
      const known = {};
      let shown = { nums: {}, shares: noShares() };
      let goal = { nums: {}, shares: noShares() };
      let tween = null;

      function noShares() {
        const shares = {};
        SERIES.forEach((key) => {
          shares[key] = 0;
        });
        return shares;
      }

      /* Shares are drawn only when every count is real and the parts add up to the total. */
      function sharesOf(counts) {
        const shares = noShares();
        if (!COUNT_KEYS.every((key) => counts[key] !== undefined))
          return shares;
        const sum = SERIES.reduce((running, key) => running + counts[key], 0);
        if (counts.total <= 0 || sum !== counts.total) return shares;
        SERIES.forEach((key) => {
          shares[key] = counts[key] / counts.total;
        });
        return shares;
      }

      function hasShares(shares) {
        return SERIES.some((key) => shares[key] > 0);
      }

      function shareText(share) {
        const percent = share * 100;
        if (percent > 0 && percent < 1) return "<1%";
        if (percent > 99 && percent < 100) return ">99%";
        return `${Math.round(percent)}%`;
      }

      function setText(el, text) {
        if (el.textContent !== text) el.textContent = text;
      }

      function retrigger(el, className) {
        el.classList.remove(className);
        void el.offsetWidth;
        el.classList.add(className);
      }

      function paint(numberKeys) {
        numberKeys.forEach((key) => {
          setText(numberEls[key], String(Math.round(shown.nums[key])));
        });
        if (shown.nums.available !== undefined) {
          numberEls.available.dataset.len = String(
            String(Math.round(shown.nums.available)).length,
          );
        }

        const drawing = hasShares(shown.shares) || hasShares(goal.shares);
        const gap =
          SERIES.filter((key) => shown.shares[key] > 0.0005).length > 1
            ? SEGMENT_GAP
            : 0;
        let start = 0;
        SERIES.forEach((key) => {
          const part = seriesParts[key];
          const share = shown.shares[key];
          const length = share * RING_LENGTH;
          const drawn =
            length > 0 ? Math.max(length - gap, Math.min(length, 1.2)) : 0;
          const lead = start + (length - drawn) / 2;
          part.segment.style.strokeDasharray = `${drawn.toFixed(2)} ${(RING_LENGTH - drawn).toFixed(2)}`;
          part.segment.style.strokeDashoffset = (RING_LENGTH - lead).toFixed(2);
          start += length;
          if (part.dialArc) {
            const arc = share * DIAL_LENGTH;
            part.dialArc.style.strokeDasharray = `${arc.toFixed(2)} ${(DIAL_LENGTH - arc).toFixed(2)}`;
            setText(part.dialPct, drawing ? shareText(share) : "–");
          }
        });
      }

      function describeRing() {
        if (!hasShares(goal.shares)) {
          return "Shares of the total servings appear here after a check.";
        }
        const parts = SERIES.map(
          (key) => `${seriesParts[key].name} ${goal.nums[key]}`,
        );
        return `Total servings ${goal.nums.total}: ${parts.join(", ")}.`;
      }

      function stopTween() {
        if (!tween) return;
        cancelAnimationFrame(tween.frame);
        clearTimeout(tween.timer);
        tween = null;
      }

      function settle() {
        const numberKeys = tween ? tween.keys : [];
        stopTween();
        shown = { nums: { ...goal.nums }, shares: { ...goal.shares } };
        paint(numberKeys);
        ring.setAttribute("aria-label", describeRing());
      }

      function step(now) {
        if (!tween) return;
        const progress = Math.min(
          1,
          Math.max(0, (now - tween.startedAt) / COUNTER_MS),
        );
        if (progress >= 1) {
          settle();
          return;
        }
        const eased = 1 - Math.pow(1 - progress, 4);
        const mix = (from, to) => from + (to - from) * eased;
        tween.keys.forEach((key) => {
          shown.nums[key] = mix(tween.from.nums[key], goal.nums[key]);
        });
        SERIES.forEach((key) => {
          shown.shares[key] = mix(tween.from.shares[key], goal.shares[key]);
        });
        paint(tween.keys);
        tween.frame = requestAnimationFrame(step);
      }

      function paintMetrics(next) {
        COUNT_KEYS.forEach((key) => {
          const value = next[key];
          if (Number.isInteger(value) && value >= 0) known[key] = value;
        });
        const nextGoal = { nums: { ...known }, shares: sharesOf(known) };
        const changed =
          COUNT_KEYS.some((key) => nextGoal.nums[key] !== goal.nums[key]) ||
          SERIES.some((key) => nextGoal.shares[key] !== goal.shares[key]);
        if (!changed) return;

        stopTween();
        goal = nextGoal;
        hideTip();
        if (reduceMotion.matches || document.hidden) {
          settle();
          return;
        }

        /* Numbers roll only between two real values; a first reading appears as-is. */
        const from = { nums: { ...shown.nums }, shares: { ...shown.shares } };
        const keys = COUNT_KEYS.filter(
          (key) =>
            from.nums[key] !== undefined &&
            goal.nums[key] !== undefined &&
            from.nums[key] !== goal.nums[key],
        );
        shown.nums = { ...goal.nums, ...pick(from.nums, keys) };
        tween = {
          from,
          keys,
          startedAt: performance.now(),
          frame: 0,
          timer: setTimeout(settle, COUNTER_MS + 300),
        };
        keys.forEach((key) => retrigger(numberEls[key], "is-popped"));
        paint(keys);
        tween.frame = requestAnimationFrame(step);
      }

      function pick(source, keys) {
        const picked = {};
        keys.forEach((key) => {
          picked[key] = source[key];
        });
        return picked;
      }

      /* ---- Ring details on hover or touch, and the gentle card tilt ---- */

      let tipTimer = null;

      function spotlight(seriesKey) {
        SERIES.forEach((key) => {
          const part = seriesParts[key];
          part.segment.classList.toggle(
            "is-dim",
            seriesKey !== null && key !== seriesKey,
          );
          part.home.classList.toggle("is-lit", key === seriesKey);
        });
      }

      function hideTip() {
        clearTimeout(tipTimer);
        tip.dataset.open = "false";
        spotlight(null);
      }

      function seriesAt(event) {
        if (!hasShares(goal.shares)) return null;
        const box = ring.getBoundingClientRect();
        const half = box.width / 2;
        const dx = event.clientX - (box.left + half);
        const dy = event.clientY - (box.top + half);
        const reach = Math.hypot(dx, dy) / half;
        if (reach < 0.62 || reach > 1) return null;
        let turn = Math.atan2(dx, -dy) / (2 * Math.PI);
        if (turn < 0) turn += 1;
        let covered = 0;
        for (const key of SERIES) {
          covered += goal.shares[key];
          if (turn < covered) return key;
        }
        return null;
      }

      function showTip(event) {
        const key = seriesAt(event);
        if (key === null) {
          hideTip();
          return;
        }
        clearTimeout(tipTimer);
        tip.dataset.series = key;
        tipValue.textContent = String(goal.nums[key]);
        tipName.textContent = seriesParts[key].name;
        tipShare.textContent = `${shareText(goal.shares[key])} of total servings`;
        /* The note sits just outside the ring, so it never covers the ring or its number. */
        const box = stage.getBoundingClientRect();
        const halfTip = tip.offsetWidth / 2;
        const below = event.clientY - box.top > box.height / 2;
        const x = Math.min(
          Math.max(event.clientX - box.left, halfTip - 28),
          box.width - halfTip + 28,
        );
        tip.dataset.side = below ? "below" : "above";
        tip.style.left = `${x.toFixed(1)}px`;
        tip.style.top = `${(below ? box.height + 8 : -8).toFixed(1)}px`;
        tip.dataset.open = "true";
        spotlight(key);
        if (event.pointerType !== "mouse") tipTimer = setTimeout(hideTip, 2400);
      }

      /* Listening on the whole card keeps the note steady while the card tilts. */
      hero.addEventListener("pointermove", showTip);
      hero.addEventListener("pointerdown", showTip);

      SERIES.forEach((key) => {
        const home = seriesParts[key].home;
        if (!home.classList.contains("tile")) return;
        home.addEventListener("pointerenter", () => {
          if (hasShares(goal.shares)) spotlight(key);
        });
        home.addEventListener("pointerleave", () => spotlight(null));
      });

      hero.addEventListener("pointermove", (event) => {
        if (!finePointer.matches || reduceMotion.matches) return;
        const box = hero.getBoundingClientRect();
        const across = (event.clientX - box.left) / box.width;
        const down = (event.clientY - box.top) / box.height;
        hero.style.setProperty(
          "--tilt-x",
          `${((0.5 - down) * 5).toFixed(2)}deg`,
        );
        hero.style.setProperty(
          "--tilt-y",
          `${((across - 0.5) * 5).toFixed(2)}deg`,
        );
        hero.style.setProperty("--sheen-x", `${(across * 100).toFixed(1)}%`);
        hero.style.setProperty("--sheen-y", `${(down * 100).toFixed(1)}%`);
      });
      hero.addEventListener("pointerleave", (event) => {
        if (event.pointerType === "mouse") hideTip();
        ["--tilt-x", "--tilt-y", "--sheen-x", "--sheen-y"].forEach((name) => {
          hero.style.removeProperty(name);
        });
      });

      /* ---- Listing link, button and status ---- */

      function setBusy(busy) {
        const flag = busy ? "true" : "false";
        ask.dataset.busy = flag;
        hero.setAttribute("aria-busy", flag);
      }

      function clearWaitTimer() {
        if (waitTimer !== null) {
          clearTimeout(waitTimer);
          waitTimer = null;
        }
      }

      function badgeTone(label) {
        if (label === "Available now") return "success";
        if (label === "All servings taken") return "gold";
        return "neutral";
      }

      function syncControls(next) {
        const dropId = typeof next.drop_id === "string" ? next.drop_id : "";
        const pageId = typeof next.page_id === "string" ? next.page_id : "";
        binding =
          uuid.test(dropId) && pageId === `owl-whats-left-${dropId}`
            ? { drop_id: dropId, page_id: pageId }
            : null;

        if (typeof next.status_label === "string") {
          const tone = badgeTone(next.status_label);
          if (statusBadge.dataset.tone !== tone) {
            statusBadge.dataset.tone = tone;
            retrigger(statusBadge, "is-popped");
          }
        }
        if (typeof next.checked_at_iso === "string" && next.checked_at_iso) {
          checkedTime.setAttribute("datetime", next.checked_at_iso);
        }

        const errMsg = typeof next.error === "string" ? next.error.trim() : "";
        const hasError = next.ok === false || errMsg.length > 0;
        errorBox.style.display = hasError ? "" : "none";
        if (hasError && !errMsg) {
          errorText.textContent =
            "Couldn't check Owl Plate just now. Try again in a moment.";
        }

        clearWaitTimer();
        setBusy(false);
        if (!binding) {
          waiting = false;
          ask.disabled = true;
          askLabel.textContent = "What's left?";
          status.textContent = UNLINKED_COPY;
          return;
        }

        ask.disabled = false;
        askLabel.textContent = "What's left?";
        if (waiting) {
          waiting = false;
          status.textContent = hasError
            ? "Couldn't refresh right now."
            : "Updated";
          if (!hasError) retrigger(stage, "is-fresh");
        } else if (status.textContent === UNLINKED_COPY) {
          status.textContent = "";
        }
      }

      function handleState(state) {
        const next = state && typeof state === "object" ? state : {};
        syncControls(next);
        paintMetrics(next);
      }

      if (typeof It !== "undefined" && typeof It.onState === "function") {
        It.onState(handleState);
      } else {
        status.textContent = UNLINKED_COPY;
      }

      ask.addEventListener("click", async () => {
        if (!binding || waiting) return;
        waiting = true;
        ask.disabled = true;
        setBusy(true);
        askLabel.textContent = "Checking…";
        status.textContent = "Checking…";
        clearWaitTimer();
        waitTimer = setTimeout(() => {
          if (!waiting) return;
          waiting = false;
          ask.disabled = !binding;
          setBusy(false);
          askLabel.textContent = "What's left?";
          status.textContent = "Still checking… Tap to try again.";
        }, 12000);
        try {
          await It.action("whats_left", binding);
        } catch (_err) {
          clearWaitTimer();
          waiting = false;
          ask.disabled = !binding;
          setBusy(false);
          askLabel.textContent = "What's left?";
          status.textContent =
            "Couldn't send that request. Try again in a moment.";
        }
      });
    </script>
  </body>
</html>
