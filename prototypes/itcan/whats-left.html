<!doctype html>
<!-- Owl Plate pickup display for It. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owl Plate – What's left?</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f8fa;
        --surface: #ffffff;
        --surface-subtle: #f1f2f6;
        --border: #e4e5ec;
        --ink: #121214;
        --ink-muted: #525560;
        --gold: #fdbb30;
        --gold-hover: #e5a41b;
        --gold-ink: #121214;
        --gold-text: #8a5e00;
        --gold-tint: #fef6e1;
        --success: #15803d;
        --success-tint: #dcfce7;
        --warning: #92400e;
        --warning-tint: #fef3c7;
        --danger: #be123c;
        --danger-tint: #ffe4e6;
        --shadow: 0 3px 20px rgba(18, 18, 20, 0.045);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0f1013;
          --surface: #18191e;
          --surface-subtle: #22242b;
          --border: #353842;
          --ink: #f4f4f6;
          --ink-muted: #a1a5b2;
          --gold: #fdbb30;
          --gold-hover: #e5a41b;
          --gold-ink: #121214;
          --gold-text: #fdbb30;
          --gold-tint: #382e19;
          --success: #4ade80;
          --success-tint: #163424;
          --warning: #fbbf24;
          --warning-tint: #3d2f16;
          --danger: #fb7185;
          --danger-tint: #3b1e29;
          --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      :focus-visible {
        outline: 3px solid var(--gold-text);
        outline-offset: 3px;
      }

      .shell {
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 16px 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 14px;
        background: var(--gold);
        color: var(--gold-ink);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-name {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .brand-sub {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 9999px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
      }

      .pill-demo {
        background: var(--gold-tint);
        color: var(--gold-text);
      }

      .status-badge {
        background: var(--surface-subtle);
        color: var(--ink-muted);
      }

      .status-badge[data-tone="success"] {
        background: var(--success-tint);
        color: var(--success);
      }

      .status-badge[data-tone="gold"] {
        background: var(--gold-tint);
        color: var(--gold-text);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 4px 16px 12px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 18px;
        box-shadow: var(--shadow);
      }

      .listing-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .listing-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .food-name {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .location {
        margin: 0;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-muted);
      }

      .location svg {
        flex-shrink: 0;
        margin-top: 2px;
      }

      .answer {
        margin: 4px 0 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }

      .error-banner {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--warning-tint);
        color: var(--warning);
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }

      .error-banner svg {
        flex-shrink: 0;
        margin-top: 2px;
      }

      .counts-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .hero-count {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        border-radius: 18px;
        background: var(--success-tint);
        padding: 16px 18px;
      }

      .hero-primary {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .hero-num {
        font-size: 56px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        color: var(--success);
      }

      .hero-label {
        margin-top: 4px;
        font-size: 14px;
        font-weight: 700;
        color: var(--success);
      }

      .total-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 14px;
        text-align: center;
        min-width: 112px;
      }

      .total-num {
        font-size: 26px;
        font-weight: 800;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      .total-label {
        margin-top: 2px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .tile {
        background: var(--surface-subtle);
        border-radius: 16px;
        padding: 14px 10px;
        text-align: center;
        min-width: 0;
      }

      .num {
        font-size: 32px;
        font-weight: 800;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      .num-accent {
        color: var(--gold-text);
      }

      .cap {
        margin-top: 6px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--ink-muted);
      }

      .section-divider {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 2px 0 0;
      }

      .meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--ink-muted);
        padding-top: 2px;
      }

      .updated-text {
        margin: 0;
        font-weight: 500;
      }

      .live-status {
        font-weight: 700;
        color: var(--gold-text);
        min-height: 18px;
      }

      footer {
        padding: 8px 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .primary-btn {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 9999px;
        background: var(--gold);
        color: var(--gold-ink);
        font-family: inherit;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
        cursor: pointer;
        touch-action: manipulation;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 24px;
        transition:
          background-color 150ms ease,
          opacity 150ms ease,
          transform 100ms ease;
      }

      .primary-btn:hover:not(:disabled) {
        background: var(--gold-hover);
      }

      .primary-btn:active:not(:disabled) {
        transform: scale(0.99);
      }

      .primary-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .disclosure {
        margin: 0;
        text-align: center;
        font-size: 12px;
        line-height: 1.4;
        color: var(--ink-muted);
      }

      .disclosure a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 2px;
        color: var(--ink);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
        touch-action: manipulation;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg
              width="21"
              height="21"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8" />
              <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7" />
              <path d="m2.1 21.8 6.4-6.3" />
              <path d="m19 5-7 7" />
            </svg>
          </div>
          <div>
            <div class="brand-name">Owl Plate</div>
            <div class="brand-sub">Pickup display</div>
          </div>
        </div>
        <span class="pill pill-demo">Demo</span>
      </header>

      <main>
        <section class="card listing-card" aria-label="Listing details">
          <div class="listing-top">
            <span
              class="pill status-badge"
              id="status-badge"
              data-tone="neutral"
              data-it-bind="status_label"
              >Loading…</span
            >
          </div>
          <h1 class="food-name" data-it-bind="food_name">Shared food</h1>
          <p class="location">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
            <span data-it-bind="location">Campus pickup</span>
          </p>
          <p class="answer" data-it-bind="answer">
            Tap “What's left?” to check servings.
          </p>
        </section>

        <div
          class="error-banner"
          id="error-box"
          data-it-show="error"
          role="alert"
          style="display: none"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" x2="12" y1="8" y2="12" />
            <line x1="12" x2="12.01" y1="16" y2="16" />
          </svg>
          <span id="error-text" data-it-bind="error"></span>
        </div>

        <section class="card counts-card" aria-label="Serving counts">
          <div class="hero-count">
            <div class="hero-primary">
              <div class="hero-num" data-it-bind="available">–</div>
              <div class="hero-label">Available</div>
            </div>
            <div class="total-box">
              <div class="total-num" data-it-bind="total">–</div>
              <div class="total-label">Total servings</div>
            </div>
          </div>

          <div class="grid">
            <div class="tile">
              <div class="num num-accent" data-it-bind="held">–</div>
              <div class="cap">Student reservations</div>
            </div>
            <div class="tile">
              <div class="num" data-it-bind="picked_up">–</div>
              <div class="cap">Completed pickups</div>
            </div>
          </div>

          <hr class="section-divider" />

          <div class="grid">
            <div class="tile">
              <div class="num" data-it-bind="pantry_held">0</div>
              <div class="cap">Pantry reserved</div>
            </div>
            <div class="tile">
              <div class="num" data-it-bind="pantry_transferred">0</div>
              <div class="cap">Pantry transfers (simulated)</div>
            </div>
          </div>

          <div class="meta-row">
            <p class="updated-text">
              Updated <time id="checked-time" data-it-bind="checked_at">—</time>
            </p>
            <span
              class="live-status"
              id="status"
              role="status"
              aria-live="polite"
            ></span>
          </div>
        </section>
      </main>

      <footer>
        <button id="ask" type="button" class="primary-btn" disabled>
          <span id="ask-label">What's left?</span>
        </button>
        <p class="disclosure">
          Demo only · not a
          <a
            href="https://campus.kennesaw.edu/current-students/student-affairs/wellbeing/care-services/"
            target="_blank"
            rel="noopener noreferrer"
            >KSU CARE</a
          >
          or
          <a
            href="https://campus.kennesaw.edu/offices-services/catering/policies.php"
            target="_blank"
            rel="noopener noreferrer"
            >catering</a
          >
          approval
        </p>
      </footer>
    </div>

    <script>
      const ask = document.getElementById("ask");
      const askLabel = document.getElementById("ask-label");
      const status = document.getElementById("status");
      const statusBadge = document.getElementById("status-badge");
      const checkedTime = document.getElementById("checked-time");
      const errorBox = document.getElementById("error-box");
      const errorText = document.getElementById("error-text");
      const uuid =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      const UNLINKED_COPY = "This display isn't linked to a listing.";
      let binding = null;
      let waiting = false;
      let waitTimer = null;

      function clearWaitTimer() {
        if (waitTimer !== null) {
          clearTimeout(waitTimer);
          waitTimer = null;
        }
      }

      function badgeTone(label) {
        if (label === "Available now") return "success";
        if (label === "All servings taken") return "gold";
        return "neutral";
      }

      function handleState(state) {
        const next = state && typeof state === "object" ? state : {};
        const dropId = typeof next.drop_id === "string" ? next.drop_id : "";
        const pageId = typeof next.page_id === "string" ? next.page_id : "";
        binding =
          uuid.test(dropId) && pageId === `owl-whats-left-${dropId}`
            ? { drop_id: dropId, page_id: pageId }
            : null;

        if (typeof next.status_label === "string") {
          statusBadge.dataset.tone = badgeTone(next.status_label);
        }
        if (typeof next.checked_at_iso === "string" && next.checked_at_iso) {
          checkedTime.setAttribute("datetime", next.checked_at_iso);
        }

        const errMsg = typeof next.error === "string" ? next.error.trim() : "";
        const hasError = next.ok === false || errMsg.length > 0;
        errorBox.style.display = hasError ? "" : "none";
        if (hasError && !errMsg) {
          errorText.textContent =
            "Couldn't check Owl Plate just now. Try again in a moment.";
        }

        clearWaitTimer();
        if (!binding) {
          waiting = false;
          ask.disabled = true;
          askLabel.textContent = "What's left?";
          status.textContent = UNLINKED_COPY;
          return;
        }

        ask.disabled = false;
        askLabel.textContent = "What's left?";
        if (waiting) {
          waiting = false;
          status.textContent = hasError
            ? "Couldn't refresh right now."
            : "Updated";
        } else if (status.textContent === UNLINKED_COPY) {
          status.textContent = "";
        }
      }

      if (typeof It !== "undefined" && typeof It.onState === "function") {
        It.onState(handleState);
      } else {
        status.textContent = UNLINKED_COPY;
      }

      ask.addEventListener("click", async () => {
        if (!binding || waiting) return;
        waiting = true;
        ask.disabled = true;
        askLabel.textContent = "Checking…";
        status.textContent = "Checking…";
        clearWaitTimer();
        waitTimer = setTimeout(() => {
          if (!waiting) return;
          waiting = false;
          ask.disabled = !binding;
          askLabel.textContent = "What's left?";
          status.textContent = "Still checking… Tap to try again.";
        }, 12000);
        try {
          await It.action("whats_left", binding);
        } catch (_err) {
          clearWaitTimer();
          waiting = false;
          ask.disabled = !binding;
          askLabel.textContent = "What's left?";
          status.textContent =
            "Couldn't send that request. Try again in a moment.";
        }
      });
    </script>
  </body>
</html>
